name: Android Build (APK)

# Margin Lens — SPA без бекенда: бандл = index.html + core/, збирається в APK
# повністю офлайн (сервер не потрібен).

on:
  push:
    branches: [main, mobile/android-ios]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Stage web bundle (index.html + core/)
        run: npm ci && npm run build

      # cap copy (НЕ sync): нативні налаштування (Java-пакет margin_lens) вже
      # закомічені — sync переписав би applicationId назад на дефісний appId.
      - name: Copy web assets into Android project
        run: npx cap copy android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact (30 днів)
        uses: actions/upload-artifact@v4
        with:
          name: margin-lens-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
